name: Task
description: Track a scoped implementation task.
title: "Task: "
labels:
  - task
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What defines done?
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: GitHub username of assignee
    validations:
      required: true
