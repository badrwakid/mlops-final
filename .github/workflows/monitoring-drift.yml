name: Monitoring Drift Report

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull monitoring artifacts from DVC or bootstrap with UCI + dvc repro (free)
        env:
          DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          if [ -f data/splits/model.pkl ] && [ -f data/splits/preprocessor.pkl ] && [ -f data/splits/reference.parquet ] && [ -f data/splits/production.parquet ]; then
            echo "monitoring artifacts already present"
            exit 0
          fi
          if [ -n "${DVC_REMOTE_URL}" ]; then
            pip install "dvc[s3]==3.51.2"
            dvc remote modify localremote url "${DVC_REMOTE_URL}"
            dvc pull data/splits/model.pkl data/splits/preprocessor.pkl data/splits/reference.parquet data/splits/production.parquet
            exit 0
          fi
          echo "No DVC secrets: downloading UCI hour.csv and running dvc repro for splits (no cloud account)"
          python scripts/fetch_uci_hour_csv.py
          dvc repro

      - name: Run monitoring pipeline (operational)
        run: python -m monitoring.run_monitoring

      - name: Upload operational drift artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drift-reports
          retention-days: 14
          if-no-files-found: error
          path: |
            monitoring/evidently_reports/drift_summary.json
            monitoring/evidently_reports/baseline.html
            monitoring/evidently_reports/drift.html
            monitoring/evidently_reports/interpretation.md

