name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check src/ tests/

  test:
    name: test
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pytest with coverage
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage XML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  data-validation:
    name: data-validation
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull missing raw artifact from DVC (if needed)
        env:
          DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
        run: |
          if [ -f data/raw/hour.csv ]; then
            echo "raw artifact already present"
            exit 0
          fi
          if [ -z "${DVC_REMOTE_URL}" ]; then
            echo "ERROR: data/raw/hour.csv missing and DVC_REMOTE_URL secret is not set."
            exit 1
          fi
          pip install "dvc[s3]==3.51.2"
          dvc remote modify localremote url "${DVC_REMOTE_URL}"
          dvc pull data/raw/hour.csv

      - name: Verify raw data artifact is present
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [Path("data/raw/hour.csv")]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(
                  "Missing required data artifact(s): "
                  + ", ".join(missing)
                  + ". Run dvc pull (or dvc repro) before CI model/data validation."
              )
          print("OK: required raw data artifact present")
          PY

      - name: Data validation (Pandera)
        run: python -m pytest tests/data/ -v

  model-validation:
    name: model-validation
    needs: [data-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      REQUIRE_LOCAL_MODEL_ARTIFACTS: "1"
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull missing model artifacts from DVC (if needed)
        env:
          DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
        run: |
          if [ -f data/splits/model.pkl ] && [ -f data/splits/preprocessor.pkl ] && [ -f data/splits/metrics.json ]; then
            echo "model artifacts already present"
            exit 0
          fi
          if [ -z "${DVC_REMOTE_URL}" ]; then
            echo "ERROR: model artifacts missing and DVC_REMOTE_URL secret is not set."
            exit 1
          fi
          pip install "dvc[s3]==3.51.2"
          dvc remote modify localremote url "${DVC_REMOTE_URL}"
          dvc pull data/splits/model.pkl data/splits/preprocessor.pkl

      - name: Verify model artifacts are present
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path("data/splits/model.pkl"),
              Path("data/splits/preprocessor.pkl"),
              Path("data/splits/metrics.json"),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(
                  "Missing required model artifact(s): "
                  + ", ".join(missing)
                  + ". Run dvc pull (or dvc repro) before CI model validation."
              )
          print("OK: required model artifacts present")
          PY

      - name: Start local MLflow tracking server
        run: |
          python -m mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlartifacts \
            --host 127.0.0.1 \
            --port 5000 &
          sleep 5

      - name: Seed MLflow registry Production model
        run: |
          python - <<'PY'
          import joblib
          import mlflow
          import mlflow.sklearn
          from mlflow.tracking import MlflowClient
          from src.config import load_config

          cfg = load_config()
          mlflow.set_tracking_uri("http://127.0.0.1:5000")
          mlflow.set_experiment("ci-model-validation")
          model = joblib.load(cfg.paths.model)

          with mlflow.start_run(run_name="ci-seed-production-model"):
              model_info = mlflow.sklearn.log_model(
                  model,
                  artifact_path="model",
                  registered_model_name=cfg.mlflow.registered_model_name,
              )

          version = model_info.registered_model_version
          client = MlflowClient(tracking_uri="http://127.0.0.1:5000")
          client.transition_model_version_stage(
              name=cfg.mlflow.registered_model_name,
              version=version,
              stage="Production",
              archive_existing_versions=True,
          )
          print(f"seeded production model version={version}")
          PY

      - name: Model validation
        run: python scripts/validate_model.py
