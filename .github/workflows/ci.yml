name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check src/ tests/

  test:
    name: test
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pytest with coverage
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage XML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  data-validation:
    name: data-validation
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull raw artifact from DVC or bootstrap UCI data (free)
        env:
          DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -n "${DVC_REMOTE_URL}" ]; then
            pip install "dvc==3.51.2"
            dvc remote modify localremote url "${DVC_REMOTE_URL}"
            dvc remote modify localremote auth basic
            dvc remote modify localremote user badrwakid
            dvc remote modify localremote password "${DAGSHUB_TOKEN}"
            dvc pull data/raw/hour.csv
            exit 0
          fi
          echo "No DVC secrets: downloading UCI Bike Sharing hour.csv (no cloud account or card required)"
          python scripts/fetch_uci_hour_csv.py

      - name: Verify raw data artifact is present
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [Path("data/raw/hour.csv")]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(
                  "Missing required data artifact(s): "
                  + ", ".join(missing)
                  + ". Run dvc pull (or dvc repro) before CI model/data validation."
              )
          print("OK: required raw data artifact present")
          PY

      - name: Data validation (Pandera)
        run: python -m pytest tests/data/ -v

  model-validation:
    name: model-validation
    needs: [data-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}
      REQUIRE_LOCAL_MODEL_ARTIFACTS: "1"
      # Same MLflow image & SQLite backend as docker-compose `mlflow` (host maps :5001 → container :5000).
      MLFLOW_TRACKING_URI: http://127.0.0.1:5001
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull model artifacts from DVC or build with dvc repro (free)
        env:
          DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -n "${DVC_REMOTE_URL}" ]; then
            pip install "dvc==3.51.2"
            dvc remote modify localremote url "${DVC_REMOTE_URL}"
            dvc remote modify localremote auth basic
            dvc remote modify localremote user badrwakid
            dvc remote modify localremote password "${DAGSHUB_TOKEN}"
            dvc pull data/splits/model.pkl data/splits/preprocessor.pkl
            exit 0
          fi
          echo "No DVC secrets: fetch UCI raw data and run full pipeline (deterministic; no paid cloud)"
          python scripts/fetch_uci_hour_csv.py
          # Use local file URI so the train stage can log to MLflow without a running server.
          # The Docker MLflow instance starts in a later step for the actual validation gate.
          MLFLOW_TRACKING_URI=file:./mlruns dvc repro

      - name: Verify model artifacts are present
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path("data/splits/model.pkl"),
              Path("data/splits/preprocessor.pkl"),
              Path("data/splits/metrics.json"),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(
                  "Missing required model artifact(s): "
                  + ", ".join(missing)
                  + ". Run dvc pull (or dvc repro) before CI model validation."
              )
          print("OK: required model artifacts present")
          PY

      - name: Start MLflow (Docker Compose — production Dockerfile)
        run: |
          docker compose build mlflow
          docker compose up -d mlflow
          docker compose exec -T -u 0 mlflow sh -lc "mkdir -p /mlflow/mlruns && chown -R 1000:1000 /mlflow"
          echo "Waiting for MLflow health on http://127.0.0.1:5001 ..."
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5001/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::MLflow did not become healthy on http://127.0.0.1:5001"
            docker compose logs mlflow || true
            exit 1
          fi
          echo "MLflow ready (bike-mlflow image, same as local docker compose)"

      - name: Seed MLflow Production model
        run: python scripts/seed_mlflow_production.py --experiment ci-model-validation

      - name: Model validation
        run: python scripts/validate_model.py

      - name: Stop MLflow container
        if: always()
        run: docker compose down mlflow --remove-orphans || true

  compose-validate:
    name: compose-validate
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Create placeholder artifacts for Docker build context
        run: |
          mkdir -p data/splits
          touch data/splits/preprocessor.pkl data/splits/reference.parquet data/splits/model.pkl

      - name: Build production service images
        run: docker compose build mlflow api

  monitoring-validation:
    name: monitoring-validation
    needs: [model-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve monitoring artifacts (DVC pull or UCI + dvc repro)
        env:
          DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -n "${DVC_REMOTE_URL}" ]; then
            pip install "dvc==3.51.2"
            dvc remote modify localremote url "${DVC_REMOTE_URL}"
            dvc remote modify localremote auth basic
            dvc remote modify localremote user badrwakid
            dvc remote modify localremote password "${DAGSHUB_TOKEN}"
            dvc pull data/splits/model.pkl data/splits/preprocessor.pkl data/splits/reference.parquet data/splits/production.parquet
            exit 0
          fi
          echo "Bootstrap from UCI + full pipeline (operational monitoring; no cloud)"
          python scripts/fetch_uci_hour_csv.py
          MLFLOW_TRACKING_URI=file:./mlruns dvc repro

      - name: Operational drift pipeline (Evidently; synthetic demo disabled in params)
        run: python -m monitoring.run_monitoring

      - name: Upload drift evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drift-reports-ci
          retention-days: 14
          if-no-files-found: error
          path: |
            monitoring/evidently_reports/drift_summary.json
            monitoring/evidently_reports/baseline.html
            monitoring/evidently_reports/drift.html
            monitoring/evidently_reports/interpretation.md
