services:
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: bike-mlflow:latest
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: bike-api:latest
    container_name: api
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  dashboard:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    image: bike-dashboard:latest
    container_name: dashboard
    depends_on:
      api:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_UI_URL: http://localhost:5000
      PROMETHEUS_URL: http://localhost:9090
      MLFLOW_MODEL_NAME: bike_share_regressor
      PROJECT_ROOT: /app
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mlflow-data:
