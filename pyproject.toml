[project]
name = "mlops-final"
version = "0.1.0"
requires-python = ">=3.11,<3.13"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.coverage.run]
source = ["src", "monitoring"]
omit = [
    "src/training/train.py",
    "src/training/hpo.py",
    "src/training/registry.py",
    "src/serving/metrics.py",
    # Streamlit page-rendering functions require a live Streamlit runtime;
    # helper functions (pure utils, file-IO, HTTP) are tested in test_dashboard_coverage.py
    "src/dashboard/app.py",
]
