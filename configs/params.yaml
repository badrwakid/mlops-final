paths:
  raw_csv: data/raw/hour.csv
  processed: data/processed/bike_clean.parquet
  train: data/splits/train.parquet
  test: data/splits/test.parquet
  reference: data/splits/reference.parquet
  production: data/splits/production.parquet
  preprocessor: data/splits/preprocessor.pkl
  model: data/splits/model.pkl
  metrics: data/splits/metrics.json

data:
  target: cnt
  drop_columns: [instant, dteday, casual, registered]
  numeric_features: [temp, atemp, hum, windspeed, hr, mnth]
  categorical_features: [season, holiday, workingday, weathersit, weekday]
  split_column: yr
  test_size: 0.2
  reference_holdout: 0.10
  random_state: 42

preprocessing:
  numeric_imputer_strategy: median
  categorical_imputer_strategy: most_frequent
  # Lecture 03b: cyclical sin/cos for hour (24) and month (12); disable to compare against raw hr/mnth + StandardScaler
  cyclical_hr_mnth: true
  feature_selection_k: 14
  # Written by featurize: ranked f-scores from SelectKBest (before k selection)
  feature_scores_json: docs/feature_scores.json

training:
  model_type: hist_gradient_boosting
  # Lecture 04: ~60 random trials; with expanded grid, 60 remains a strong sample
  n_trials: 60
  cv_folds: 3
  hpo_search_space:
    max_iter: [200, 400, 700]
    learning_rate: [0.03, 0.05, 0.1]
    max_depth: [4, 8, null]
    max_leaf_nodes: [31, 63, 127]
    min_samples_leaf: [10, 20, 40]
    l2_regularization: [0.0, 0.1, 1.0]

drift:
  perturb_temp_factor: 1.10
  perturb_hum_factor: 0.85
  perturb_windspeed_noise_std: 0.05
  drift_threshold_share: 0.20
  perturbed_features: [temp, hum, windspeed]

serving:
  model_name: bike_share_regressor
  model_stage: Production
  api_host: 0.0.0.0
  api_port: 8000

mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: bike_sharing
  registered_model_name: bike_share_regressor

validation:
  min_test_r2: 0.70
  # CI model-validation: require test RMSE to stay below this ceiling (from committed metrics.json)
  rmse_threshold: 80.0